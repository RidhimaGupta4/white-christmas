  <g id="text_16">
   <text style="font-weight: 700; font-size: 15px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="31.68" y="32.02725" transform="rotate(-0 31.68 32.02725)">How often is Christmas white? It depends on the definition</text>
  </g>
  <g id="text_17">
   <text style="font-size: 10px; font-family: 'Inter'; fill: #52514e" transform="translate(31.68 58.974477)">Share of Christmas Days 1960–2025 counted as 'white' under five definitions, UK Met Office stations.</text>
   <text style="font-size: 10px; font-family: 'Inter'; fill: #52514e" transform="translate(31.68 76.88268)">Black lines show 95% intervals. Blue is the Met Office's own rule.</text>
  </g>
  <g id="text_18">
   <text style="font-size: 7.5px; font-family: 'Inter'; text-anchor: start; fill: #898781" x="31.68" y="378.350918" transform="rotate(-0 31.68 378.350918)">Data: Met Office MIDAS Open, UK daily weather observations (v202607), via CEDA. Open Government Licence.</text>
  </g>
  <g id="text_19">
   <text style="font-size: 7.5px; font-family: 'Inter'; fill: #898781" transform="translate(31.68 349.430984)">Intervals: Wilson score, treating each year as independent. 1973 excluded from 'white' under the official rule:</text>
   <text style="font-size: 7.5px; font-family: 'Inter'; fill: #898781" transform="translate(31.68 361.89219)">its only snow report is flagged suspect by Met Office quality control (including it gives 54 of 66).</text>
