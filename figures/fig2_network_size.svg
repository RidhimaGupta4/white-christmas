  <g id="text_18">
   <text style="font-weight: 700; font-size: 15px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="31.68" y="32.02725" transform="rotate(-0 31.68 32.02725)">More stations, more white Christmases</text>
  </g>
  <g id="text_19">
   <text style="font-size: 10px; font-family: 'Inter'; fill: #52514e" transform="translate(31.68 59.254945)">Same 66 Christmas Days (1960–2025), same weather. Share that would count as 'white' under the</text>
   <text style="font-size: 10px; font-family: 'Inter'; fill: #52514e" transform="translate(31.68 75.965492)">official rule (snow or sleet at any station) if the network had only this many stations.</text>
  </g>
  <g id="text_20">
   <text style="font-size: 7.5px; font-family: 'Inter'; text-anchor: start; fill: #898781" x="31.68" y="378.350918" transform="rotate(-0 31.68 378.350918)">Data: Met Office MIDAS Open, UK daily weather observations (v202607), via CEDA. Open Government Licence.</text>
  </g>
  <g id="text_21">
   <text style="font-size: 7.5px; font-family: 'Inter'; fill: #898781" transform="translate(31.68 349.469656)">Exact calculation (hypergeometric), averaged over the same 66 years for every network size; no simulation.</text>
   <text style="font-size: 7.5px; font-family: 'Inter'; fill: #898781" transform="translate(31.68 361.681838)">Assumes stations are drawn at random from each year's network, ignoring geography. Curve stops at 65, the smallest yearly network.</text>
  </g>
