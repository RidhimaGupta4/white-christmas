   <g id="text_16">
    <text style="font-size: 9px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(339.988615 118.926352)">2023: official 10.8% (7 of 65)</text>
    <text style="font-size: 9px; font-family: 'Inter'; fill: #0b0b0b" transform="translate(331.913224 129.816)">vs 3.2% counting all 219 stations</text>
   </g>
  </g>
  <g id="text_17">
   <text style="font-weight: 700; font-size: 15px; font-family: 'Inter'; text-anchor: start; fill: #0b0b0b" x="35.64" y="32.02725" transform="rotate(-0 35.64 32.02725)">Leaving out incomplete days pushes the figure up</text>
  </g>
  <g id="text_18">
   <text style="font-size: 10px; font-family: 'Inter'; fill: #52514e" transform="translate(35.64 58.935414)">Points added to the official 'snow falling' percentage on Christmas Day by excluding stations coded 9,</text>
   <text style="font-size: 10px; font-family: 'Inter'; fill: #52514e" transform="translate(35.64 76.155336)">compared with counting them as snow-free. Every year with code 9 in the data (1982–2025).</text>
  </g>
  <g id="text_19">
   <text style="font-size: 7.5px; font-family: 'Inter'; text-anchor: start; fill: #898781" x="35.64" y="378.350918" transform="rotate(-0 35.64 378.350918)">Data: Met Office MIDAS Open, UK daily weather observations (v202607), via CEDA. Open Government Licence.</text>
  </g>
  <g id="text_20">
   <text style="font-size: 7.5px; font-family: 'Inter'; fill: #898781" transform="translate(35.64 349.430984)">Met Office NCIC: code 9 is given only when no snow is reported; snow in any hour overrides it. So excluded stations are snow-free</text>
   <text style="font-size: 7.5px; font-family: 'Inter'; fill: #898781" transform="translate(35.64 361.681838)">in the hours they did observe. The true figure most plausibly lies between the two values. Zero in years with no snow anywhere.</text>
  </g>
 </g>
