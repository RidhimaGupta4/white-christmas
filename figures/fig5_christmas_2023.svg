   <text style="font-size: 10px; font-family: 'Inter'; fill: #52514e" transform="translate(31.68 56.559414)">Share of stations where snow or sleet was seen falling on 25 December 2023.</text>
   <text style="font-size: 10px; font-family: 'Inter'; fill: #52514e" transform="translate(31.68 73.557461)">The Met Office published 11%.</text>
  </g>
  <g id="text_11">
   <text style="font-size: 7.5px; font-family: 'Inter'; text-anchor: start; fill: #898781" x="31.68" y="291.950918" transform="rotate(-0 31.68 291.950918)">Data: Met Office MIDAS Open, UK daily weather observations (v202607), via CEDA. Open Government Licence.</text>
  </g>
  <g id="text_12">
   <text style="font-size: 7.5px; font-family: 'Inter'; fill: #898781" transform="translate(31.68 263.270632)">Met Office rule (NCIC): an automatic station that reports snow in any hour is counted; one whose sensor misses any hour</text>
   <text style="font-size: 7.5px; font-family: 'Inter'; fill: #898781" transform="translate(31.68 275.521487)">of a snow-free day is coded 9 and dropped. 154 of 219 stations were coded 9 in 2023 (up from 63 in 2022), due to sensor performance.</text>
